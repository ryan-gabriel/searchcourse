name: Hourly Jobs (Sync, Scrape, Cleanup, Broadcast)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-jobs
  cancel-in-progress: true

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Sync Courses (RapidAPI feed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          RAPIDAPI_MAX_PAGES: "1"
          IMPACT_AFFILIATE_BASE: ${{ secrets.IMPACT_AFFILIATE_BASE }}
        run: npm run sync
      - name: Scrape Coupons
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMPACT_AFFILIATE_BASE: ${{ secrets.IMPACT_AFFILIATE_BASE }}
        run: npm run scrape
      - name: Cleanup Expired Coupons
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run cleanup
      - name: Broadcast to Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: npm run telegram