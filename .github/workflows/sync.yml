name: Sync Udemy Courses

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          IMPACT_AFFILIATE_BASE: ${{ secrets.IMPACT_AFFILIATE_BASE }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: npm run sync
      - name: Run Cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERIFY_MAX_COUPONS: 25
          VERIFY_TIMEOUT_MS: 15000
          VERIFY_RATE_LIMIT_MS: 250
          VERIFY_HEADLESS: 'true'
          VERIFY_BROWSER_CHANNEL: none
          VERIFY_BLOCKED_THRESHOLD: 3
        run: npm run cleanup
